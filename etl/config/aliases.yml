# 名寄せ辞書。
#
# 自動で統合するのは「NFKC 正規化＋空白除去で同じキーになる表記ゆれ」だけ。
# 意味が違いそうな名前（いなだ/ぶり、その他ぶり/その他ぶり類 など）はここに書いて人が決める。
# 統合候補は `python -m etl.build` が data/processed/merge_candidates.csv に出力する。

# 大品目の別名（部門コード -> {元データの表記: 正しい大品目}）。
# 元データの入力ミス・表記違いの吸収用。
category_aliases:
  R:
    果物: 果実 # 2024-06 R11 のみ「果物」と表記
  T:
    # 2024-07 T11 のみ大品目が 1/2/3。並び順と品目から 生鮮/冷凍/塩干・加工品 と判断
    "1": 生鮮水産物
    "2": 冷凍水産物
    "3": 塩干・加工品その他

# 品目・産地の統合ルール（大品目 -> {旧名: 新名}）。初期は空。
# 例:
#   生鮮水産物:
#     いなだ: ぶり
name_aliases:
  items: {}
  origins: {}
